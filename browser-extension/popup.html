<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Gemini Translate</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header>
    <strong>Gemini Translate</strong>
    <a href="options.html" target="_blank">设置</a>
  </header>
  <label>原文</label>
  <textarea id="source" rows="5" placeholder="输入或粘贴要翻译的文字"></textarea>
  <div class="row">
    <button id="to-en" type="button">译成英文</button>
    <button id="to-zh" type="button" class="ghost">译成中文</button>
    <button id="copy" type="button" class="ghost">复制结果</button>
  </div>
  <label>译文</label>
  <textarea id="result" rows="6" readonly placeholder="翻译结果"></textarea>
  <p id="status" class="status"></p>
  <script src="popup.js"></script>
</body>
</html>
